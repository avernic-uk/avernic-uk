name = "avernic-uk"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Non-secret variables. Cloudflare Pages hands variable management for this
# project over to this file once ANY [vars] entry exists here (the Dashboard
# then only manages true Secrets — see below). VITE_-prefixed values are
# baked into the frontend bundle at build time by Vite, so they must live
# here (or in the Dashboard's own [vars]-driven config) rather than only in
# a local .env — a local-only .env never reaches the Cloudflare build.
#
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are safe to commit: the anon
# key only ever grants what Row Level Security policies allow. Never put
# the service_role key here — that stays a Dashboard Secret (see README).
#
# SUPABASE_URL (no VITE_ prefix) is a SEPARATE variable read by the
# Cloudflare Pages Functions in functions/ (the /api/* routes, including
# everything under /api/admin/*) via `context.env` — Vite's VITE_ baking
# only reaches the browser bundle, Functions never see import.meta.env.
# Same URL value as VITE_SUPABASE_URL above, just without the prefix.
[vars]
SITE_URL = "https://www.avernic.uk"
VITE_SUPABASE_URL = "https://olgcumyhyfyjaeevqowx.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_TkOiGuxX94IyB9TOjede0g_2qCOI6Gp"
SUPABASE_URL = "https://olgcumyhyfyjaeevqowx.supabase.co"
RESEND_FROM_EMAIL = "orders@avernic.uk"
ADMIN_NOTIFICATION_EMAIL = "harview@gmx.com"

# Secrets (SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, FENA_*, etc.) are NOT
# set here — they must never be committed. RESEND_API_KEY in particular is
# NOT added above on purpose, even though you shared it in chat — it's a
# real secret (it can send email as your domain), and this file is
# considered committed-to-git, safe-to-be-public content throughout this
# project. It goes in as a Dashboard Secret instead (see next steps).
# For local `wrangler pages dev`, create a `.dev.vars` file (already
# git-ignored) with KEY=value lines. For the deployed site, set secrets via
# the Cloudflare Pages dashboard -> this project -> Settings -> Secrets
# (the part that's still managed through the Dashboard, per the
# "Environment variables ... managed through wrangler.toml" notice), or
# `wrangler pages secret put RESEND_API_KEY`.
